<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>Blackjack</h1>

      <p id="message-el">Welcome to Blackjack!</p>

      <div class="buttons">
        <button id="start-game" onclick="startGame()">Deal Cards</button>

        <button id="new-card" onclick="newCard()">New Card</button>

        <button id="reset-btn" onclick="resetGame()" disabled>Reset</button>
      </div>
      <button id="hold" onclick="hold()">Hold Cards</button>

      <p id="announcement-el"></p>
      <div class="players">
        <div id="player-el">
          <h2>Player</h2>

          <p id="player-cards-el">Cards:</p>

          <p id="player-sum-el">Sum:</p>
        </div>
        <div id="dealer-el">
          <h2>Dealer</h2>

          <p id="dealer-cards-el">Cards:</p>

          <p id="dealer-sum-el">Sum:</p>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
